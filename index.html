<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>WoW Kriegsmeuten-Upgrade-Tracker v10.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wow: {
              bg: '#0b0e14',
              panel: '#131822',
              card: '#1a2130',
              border: '#2a344a',
              gold: '#f8b700',
              accent: '#3b82f6'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0b0e14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b0e14; }
    ::-webkit-scrollbar-thumb { background: #2a344a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4968; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP HEADER -->
  <header class="bg-wow-panel border-b border-wow-border sticky top-0 z-30 shadow-xl">
    <div class="max-w-[1640px] mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500 to-yellow-700 flex items-center justify-center text-slate-950 font-black text-lg shadow">
          W
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-tight flex items-center gap-2">
            Kriegsmeuten-Upgrade-Tracker
            <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-500 text-slate-950 font-black">v10.0 CLEAN</span>
          </h1>
          <p class="text-[11px] text-slate-400">100% lokale Browser-Speicherung • Keine vorprogrammierten Fremddaten • Immer aktuell per /simc</p>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="openCharPopupModal()" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black flex items-center gap-1.5 shadow transition">
          <span>🪟</span> Charakter-Popup
        </button>
        <button onclick="openSimcModal()" class="px-3.5 py-1.5 rounded-lg bg-purple-700 hover:bg-purple-600 text-white text-xs font-bold flex items-center gap-1.5 shadow border border-purple-500/40 transition">
          <span>📋</span> WoW ➔ SimCraft Import
        </button>
        <button onclick="openAddCharModal()" class="px-3 py-1.5 rounded-lg bg-wow-card hover:bg-slate-700 text-slate-200 border border-wow-border text-xs font-semibold transition">
          <span>🌐</span> + Raider.IO Charakter
        </button>
        <button onclick="refreshActiveCharRaiderIO()" class="px-3 py-1.5 rounded-lg bg-wow-card hover:bg-slate-700 text-cyan-300 border border-wow-border text-xs font-semibold transition" title="Aktualisiert den ausgewählten Charakter über Raider.IO">
          🔄 Raider.IO Update
        </button>
        <button onclick="openBackupModal()" class="px-2.5 py-1.5 rounded-lg bg-wow-card hover:bg-slate-700 text-slate-300 border border-wow-border text-xs font-medium transition">
          💾 Backup
        </button>
        <button onclick="clearAllLocalData()" class="px-2.5 py-1.5 rounded-lg bg-red-950/70 hover:bg-red-900 text-red-200 border border-red-700/50 text-xs font-bold transition" title="Löscht alle lokal gespeicherten Charaktere aus diesem Browser">
          🗑️ Lokal leeren
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-[1640px] w-full mx-auto px-4 py-5 space-y-5">

    <!-- OBEN IN EINER REIHE: ALLE CHARAKTERE ZUM ANKLICKEN -->

      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="text-base">👤</span>
          <h2 class="text-xs font-black uppercase tracking-wider text-wow-gold">
            Deine lokal gespeicherten Charaktere (Oben Charakter anklicken ➔ Unten alle Werte, Caps & 334-Max-Bedarf):
          </h2>
        </div>

        <!-- Schnell-Umschalter für Fahrplan-Ziel (331 vs. 334 Max) -->
        <div class="flex flex-wrap items-center gap-2 text-xs">
          <span class="text-slate-400 font-semibold">Fahrplan-Ziel:</span>
